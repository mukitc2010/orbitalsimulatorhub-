[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.23.4"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/asi-agent"
  to = "/.netlify/functions/asi-agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/astrobot/chat"
  to = "/.netlify/functions/astrobot-chat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://www.orbitalsimulatorhub.com; connect-src 'self' https://api.x.ai; worker-src 'self' blob:; frame-src 'self'"
