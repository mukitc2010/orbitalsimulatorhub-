<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Planet -->
  <circle cx="32" cy="32" r="22" fill="url(#planetGrad)"/>
  <circle cx="26" cy="26" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="38" cy="30" r="2" fill="rgba(255,255,255,0.4)"/>
  <!-- Orbital ring (front) -->
  <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="url(#ringGrad1)" stroke-width="6"/>
  <!-- Orbital ring (back) -->
  <ellipse cx="32" cy="32" rx="24" ry="14" fill="none" stroke="url(#ringGrad2)" stroke-width="3" opacity="0.8"/>
  <!-- Satellite dots -->
  <circle cx="18" cy="28" r="3" fill="#a78bfa"/>
  <circle cx="42" cy="22" r="2.5" fill="#38bdf8"/>
  <circle cx="52" cy="32" r="2" fill="#f97316"/>
  <!-- Text: OrbitalSimulator (navy) + Hub (purple) -->
  <text x="72" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1e3a5f">
    <tspan fill="#1e3a5f">OrbitalSimulator</tspan><tspan fill="#8b5cf6">Hub</tspan>
  </text>
</svg>
