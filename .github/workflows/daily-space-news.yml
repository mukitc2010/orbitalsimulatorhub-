name: Daily space news
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install tzdata
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python scripts/space-news/agent.py --write
      - run: node scripts/generate-rss.js
      - run: npx vite build
      - run: cp dist/index.html dist/404.html
      - name: Publish the roundup
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          git config user.name "space-news"
          git config user.email "space-news@users.noreply.github.com"
          git add client/src/data/spaceNews.json client/public/rss.xml client/public/blog/rss.xml
          if git diff --cached --quiet; then
            echo "No new roundup."
            exit 0
          fi
          git commit -m "Update the morning space news roundup."
          git push
          npx netlify-cli deploy --prod --no-build --dir dist --site 27236fbb-0596-4ba8-95d5-5dd7bc90d06d --message "Daily space news"
