name: Daily space news
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install tzdata
      - run: python scripts/space-news/agent.py --write
      - name: Publish the roundup
        run: |
          git config user.name "space-news"
          git config user.email "space-news@users.noreply.github.com"
          git add client/src/data/spaceNews.json
          git diff --cached --quiet || git commit -m "Update the morning space news roundup."
          git push
